<title>Simulador de Atendimento Infornet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: painel de treino com 4 clientes → conversa com consulta rápida ao lado → avaliação do atendimento */
:root {
  --bg: #F2F4FA;
  --surface: #FFFFFF;
  --surface-2: #E7EBF5;
  --ink: #0E1A3A;
  --muted: #56607A;
  --line: #D4DAEA;
  --accent: #1A47E6;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFE5FB;
  --me: #1A47E6;
  --me-ink: #FFFFFF;
  --them: #FFFFFF;
  --chat-bg: #E8ECF6;
  --logo-bg: #05141A;
  --novo: #23784C;
  --preco: #9A6512;
  --insat: #B4410E;
  --cancel: #A3214F;
  --good: #23784C;
  --warn: #9A6512;
  --bad: #B42318;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1222; --surface: #131B30; --surface-2: #1B2540; --ink: #E4E9F7; --muted: #95A0BC; --line: #29344F;
    --accent: #6E8CFF; --accent-ink: #061030; --accent-soft: #1A2A5E;
    --me: #1D45D6; --me-ink: #FFFFFF; --them: #1B2540; --chat-bg: #0F1628;
    --novo: #5DC48D; --preco: #E2AB4E; --insat: #F07E4A; --cancel: #EC6A96;
    --good: #5DC48D; --warn: #E2AB4E; --bad: #F2735F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1222; --surface: #131B30; --surface-2: #1B2540; --ink: #E4E9F7; --muted: #95A0BC; --line: #29344F;
  --accent: #6E8CFF; --accent-ink: #061030; --accent-soft: #1A2A5E;
  --me: #1D45D6; --me-ink: #FFFFFF; --them: #1B2540; --chat-bg: #0F1628;
  --novo: #5DC48D; --preco: #E2AB4E; --insat: #F07E4A; --cancel: #EC6A96;
  --good: #5DC48D; --warn: #E2AB4E; --bad: #F2735F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 24px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow {
  font-size: 0.74rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1px solid transparent; border-radius: 10px; padding: 10px 16px; font-weight: 600;
  background: var(--accent); color: var(--accent-ink);
  transition: filter .15s ease, background .15s ease;
}
.btn:hover { filter: brightness(1.07); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.link { background: transparent; color: var(--accent); padding: 6px 4px; }
.btn.danger { background: var(--bad); color: #fff; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Marca: a logo oficial tem fundo escuro, então fica num bloco escuro arredondado nos dois temas */
.brand {
  display: inline-flex; align-items: center; justify-content: center; background: var(--logo-bg);
  border-radius: 14px; padding: 0; width: fit-content; line-height: 0; overflow: hidden;
}
.brand img { display: block; height: 104px; width: auto; }
.brand.small img { height: 68px; }

/* Início */
.hero { display: grid; gap: 14px; max-width: 680px; }
.hero p { font-size: 1.05rem; color: var(--muted); max-width: 62ch; }
.start {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px;
}
.field { display: grid; gap: 6px; flex: 1 1 240px; min-width: 0; }
.field label { font-weight: 600; font-size: .9rem; }
.field input {
  border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%;
}
.modes { flex: 1 1 100%; border: 0; padding: 0; margin: 0; min-width: 0; }
.modes legend { font-weight: 600; font-size: .9rem; padding: 0; margin-bottom: 6px; }
.mode-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .mode-opts { grid-template-columns: 1fr; } }
.mode {
  display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; cursor: pointer; background: var(--bg);
}
.mode:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.mode input { margin-top: 5px; accent-color: var(--accent); }
.mode > span { display: grid; font-size: .86rem; line-height: 1.4; }
.mode b { font-size: .95rem; }
.temps { display: grid; gap: 10px; }
.temps p { max-width: 70ch; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.step { display: grid; gap: 4px; padding: 14px 0; border-top: 2px solid var(--line); }
.step b { font-family: var(--font-display); color: var(--accent); font-size: .85rem; }
@media (max-width: 640px) { .steps { grid-template-columns: 1fr; } }

/* Perfis */
.chip {
  --c: var(--accent);
  display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700;
  color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent);
  border-radius: 999px; padding: 3px 10px; white-space: nowrap;
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.p-novo { --c: var(--novo); }
.p-preco { --c: var(--preco); }
.p-insatisfeito { --c: var(--insat); }
.p-cancelamento { --c: var(--cancel); }

/* Painel */
.topbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; }
.progress { display: flex; gap: 18px; flex-wrap: wrap; }
.stat { display: grid; }
.stat span { font-size: .78rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.stat strong { font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0;
}
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.card .who { font-size: .9rem; color: var(--muted); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.status { font-size: .85rem; font-weight: 600; color: var(--muted); }
.status.done { color: var(--good); }
.status.live { color: var(--accent); }
.score-pill {
  font-family: var(--font-display); font-weight: 700; font-variant-numeric: tabular-nums;
  padding: 2px 10px; border-radius: 8px; background: var(--surface-2);
}
.notice {
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 14px 16px; display: grid; gap: 4px;
}
.notice.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.summary {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px;
  display: grid; gap: 14px;
}
.summary table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.summary td { padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.summary td.n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.confirm { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .92rem; }

/* Conversa */
.chat-layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
@media (max-width: 860px) { .chat-layout { grid-template-columns: minmax(0, 1fr); } }
.chat {
  background: var(--chat-bg); border: 1px solid var(--line); border-radius: var(--radius);
  display: flex; flex-direction: column; height: max(460px, calc(100dvh - 150px)); min-width: 0; overflow: hidden;
}
.chat-head {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface);
  border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.avatar {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-family: var(--font-display); font-weight: 700; color: #fff; background: var(--c, var(--accent));
}
.chat-id { display: grid; min-width: 0; flex: 1 1 160px; }
.chat-id strong { font-size: 1rem; }
.chat-id span { font-size: .82rem; color: var(--muted); }
.msgs { flex: 1; overflow-y: auto; padding: 18px 14px; display: flex; flex-direction: column; gap: 6px; }
.bubble {
  max-width: min(78%, 520px); padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 8%, transparent);
}
.bubble.them { align-self: flex-start; background: var(--them); border-top-left-radius: 4px; }
.bubble.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-top-right-radius: 4px; }
.bubble + .bubble.me, .bubble + .bubble.them { margin-top: 0; }
.bubble.me + .bubble.them, .bubble.them + .bubble.me { margin-top: 8px; }
.day { align-self: center; font-size: .75rem; color: var(--muted); background: var(--surface); border-radius: 8px; padding: 2px 10px; margin-bottom: 6px; }
.typing { align-self: flex-start; background: var(--them); border-radius: 12px; padding: 10px 14px; display: flex; gap: 4px; margin-top: 8px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; opacity: .6; } }
.ended {
  align-self: center; text-align: center; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 16px; margin-top: 12px; display: grid; gap: 8px; justify-items: center;
}
.composer { display: flex; gap: 8px; padding: 10px; background: var(--surface); border-top: 1px solid var(--line); align-items: end; }
.composer textarea {
  flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  padding: 10px 12px; min-height: 44px; max-height: 140px;
}
.err { color: var(--bad); font-size: .88rem; padding: 0 12px 8px; background: var(--surface); }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.confirm-bar { padding: 10px 14px; background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border-bottom: 1px solid var(--line); }

/* Consulta rápida */
.cola { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px 14px; }
.cola summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; padding: 12px 0; }
.cola section { display: grid; gap: 4px; padding: 10px 0; border-top: 1px solid var(--line); font-size: .88rem; }
.cola h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cola ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.ladder { display: flex; gap: 4px; flex-wrap: wrap; }
.ladder span {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: .82rem; padding: 2px 8px; border-radius: 6px;
  background: color-mix(in srgb, var(--accent) calc(var(--s) * 1%), var(--surface-2));
}
.objective { font-size: .88rem; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); }

/* Avaliação */
.eval { display: grid; gap: 16px; }
.eval-top {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;
  display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
}
.big-score { font-family: var(--font-display); font-size: 3.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.big-score small { font-size: 1.1rem; color: var(--muted); font-weight: 600; }
.eval-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .eval-grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.crit { display: grid; gap: 4px; }
.crit-top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: .92rem; }
.crit-top span:last-child { font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--c, var(--accent)); }
.crit p { font-size: .86rem; color: var(--muted); }
.list { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.example {
  margin: 0; padding: 12px 14px; border-radius: 12px; border-top-right-radius: 4px;
  background: var(--me); color: var(--me-ink); white-space: pre-wrap;
}
.transcript { display: grid; gap: 6px; font-size: .88rem; }
.transcript p b { font-weight: 700; }
.loading { display: grid; gap: 10px; justify-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
</style>

<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  var PERFIS = {
    novo: { rotulo: "Novo interessado", objetivo: "Entender a necessidade e fechar a contratação." },
    preco: { rotulo: "Comparando preços", objetivo: "Mostrar o valor da Infornet sem entrar em guerra de preço." },
    insatisfeito: { rotulo: "Cliente insatisfeito", objetivo: "Resolver o problema e recuperar a confiança." },
    cancelamento: { rotulo: "Pedido de cancelamento", objetivo: "Descobrir o motivo real e tentar reter o cliente." }
  };
  var ORDEM = ["novo", "preco", "insatisfeito", "cancelamento"];

  // O temperamento é sorteado à parte da situação: o mesmo cliente pode chegar calmo num treino e explosivo no outro.
  var TEMPERAMENTOS = {
    tranquilo: { rotulo: "Tranquilo", nivel: 1,
      tom: "Educado e paciente. Responde com calma, agradece e dá tempo ao atendente. Mesmo assim, só fecha ou aceita uma proposta se ela fizer sentido para você." },
    indeciso: { rotulo: "Indeciso", nivel: 2,
      tom: "Não sabe bem o que quer. Faz perguntas soltas, responde 'não sei', 'vou pensar', 'deixa eu ver com o pessoal de casa' e muda de ideia. Só avança se o atendente conduzir com perguntas e propor um próximo passo claro; se ninguém conduzir, você encerra com 'depois eu vejo'." },
    desconfiado: { rotulo: "Desconfiado", nivel: 2,
      tom: "Acha que todo provedor engana. Questiona as promessas ('isso é garantido?', 'tá no contrato?'), pede detalhes, desconfia de desconto bom demais e lembra de quando já foi enganado. Confia quando recebe respostas claras, honestas e sem enrolação." },
    apressado: { rotulo: "Apressado", nivel: 2,
      tom: "Está sem tempo. Escreve mensagens curtíssimas, às vezes uma palavra só ('e aí?', 'quanto?', 'resume'). Se o atendente mandar texto longo ou demorar para chegar ao ponto, você reclama ('tô no trabalho', 'vai direto ao ponto') e pode largar a conversa. Gosta de objetividade." },
    irritado: { rotulo: "Irritado", nivel: 3,
      tom: "Está com raiva. Usa caixa alta em algumas palavras, ironia e reclama de tudo. Ameaça ir ao Procon ou ao Reclame Aqui. Não aceita resposta pronta. Vai se acalmando aos poucos se o atendente reconhecer o problema com empatia, sem discutir e sem ficar se justificando." },
    explosivo: { rotulo: "Muito difícil", nivel: 3,
      tom: "O cliente mais difícil. É grosseiro (sem palavrões pesados), manda várias mensagens seguidas, generaliza ('vocês são todos iguais'), exige o impossível (mês grátis, técnico em 10 minutos) e ameaça expor a empresa nas redes sociais. Não se acalma rápido: só depois de várias respostas firmes, respeitosas e com solução concreta você começa a ceder. Se o atendente perder a paciência, for irônico ou prometer o que não pode cumprir, você piora." }
  };
  var MODOS = {
    variado: { rotulo: "Variado", texto: "Mistura clientes tranquilos e difíceis. Recomendado." },
    iniciante: { rotulo: "Aquecimento", texto: "Clientes mais tranquilos, para pegar o jeito." },
    desafio: { rotulo: "Desafio", texto: "Clientes difíceis, para quem já treinou." }
  };

  function embaralhar(lista) {
    var a = lista.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; }
    return a;
  }
  function sortearTemperamentos(modo) {
    var todos = Object.keys(TEMPERAMENTOS);
    var nivel = function (k) { return TEMPERAMENTOS[k].nivel; };
    if (modo === "iniciante") return embaralhar(todos.filter(function (k) { return nivel(k) <= 2; })).slice(0, 4);
    if (modo === "desafio") {
      var medios = embaralhar(todos.filter(function (k) { return nivel(k) === 2; })).slice(0, 2);
      return embaralhar(["irritado", "explosivo"].concat(medios));
    }
    // variado: 4 temperamentos diferentes, com pelo menos um tranquilo e um difícil
    for (var tentativa = 0; tentativa < 100; tentativa++) {
      var pick = embaralhar(todos).slice(0, 4);
      if (pick.indexOf("tranquilo") !== -1 && pick.some(function (k) { return nivel(k) === 3; })) return pick;
    }
    return embaralhar(["tranquilo", "indeciso", "desconfiado", "irritado"]);
  }

  var PERSONAS = [
    { id: "n1", perfil: "novo", nome: "Larissa", cidade: "Campo Maior",
      quem: "Professora, 34 anos. Acabou de se mudar para uma casa nova e quer contratar internet. Mora com o marido e dois filhos adolescentes.",
      abertura: "Boa tarde! Queria saber da internet de vocês, me mudei agora pra cá",
      escondido: "Vai começar a dar aulas online à noite (das 19h às 22h) e não pode ficar sem internet nesse horário. O provedor da casa antiga caía justamente à noite. Os filhos jogam e assistem vídeo ao mesmo tempo. Precisa da instalação até segunda-feira, quando começam as aulas. Quem decide é ela.",
      reage: "Se o atendente perguntar sobre o uso da casa e explicar estabilidade e suporte rápido, ela fecha. Se ele só mandar a lista de planos sem perguntar nada, ela diz que vai ver com o marido e esfria.",
      bom: "O atendente descobre o uso (aulas à noite, vários aparelhos), recomenda o plano adequado com argumento de estabilidade e suporte local, confirma o prazo de instalação e fecha a contratação." },
    { id: "n2", perfil: "novo", nome: "Diego", cidade: "Piripiri",
      quem: "Estudante, 19 anos. Joga online e quer a internet mais rápida possível.",
      abertura: "opa, qual a internet mais rapida q vcs tem?",
      escondido: "Quem paga a conta é a mãe, dona Rita, e ela já disse que não quer gastar muito. Ele joga à noite e o que mais incomoda é o atraso (ping alto), mais do que a velocidade. Hoje usa a internet do vizinho emprestada.",
      reage: "Se o atendente perguntar para que ele usa e quem decide, e propor algo que caiba no bolso da mãe (mandar um resumo para ela ou falar com ela), ele avança. Se empurrarem o plano mais caro sem perguntar nada, ele responde que a mãe não vai pagar isso e esfria.",
      bom: "O atendente identifica que a decisão e o pagamento são da mãe, entende que o problema é o ping, explica a vantagem da fibra para jogos, sugere um plano adequado e combina o próximo passo com a mãe." },
    { id: "n3", perfil: "novo", nome: "Raimundo", cidade: "Capitão de Campos",
      quem: "Dono de uma mercearia, 52 anos. Quer internet para o comércio.",
      abertura: "Bom dia. Quero ver internet pro meu comercio. Como é que funciona o contrato de vcs?",

  function persona(id) { for (var i = 0; i < PERSONAS.length; i++) if (PERSONAS[i].id === id) return PERSONAS[i]; return null; }

  function escolher(perfil) {
    var pool = PERSONAS.filter(function (p) { return p.perfil === perfil; });
    var usadosDoPerfil = estado.usados.filter(function (id) { return pool.some(function (p) { return p.id === id; }); });
    var livres = pool.filter(function (p) { return usadosDoPerfil.indexOf(p.id) === -1; });
    if (!livres.length) {
      // todos já apareceram: recomeça o ciclo, sem repetir o último cliente desse perfil
      var ultimo = usadosDoPerfil[usadosDoPerfil.length - 1];
      estado.usados = estado.usados.filter(function (id) { return usadosDoPerfil.indexOf(id) === -1; });
      livres = pool.filter(function (p) { return p.id !== ultimo; });
    }
    var p = livres[Math.floor(Math.random() * livres.length)];
    estado.usados.push(p.id);
    return p.id;
  }

  function novaSessao() {

    var res = {}, mapa = {};
    ids.forEach(function (id, i) {
      res[id] = { estado: "pendente", msgs: [], fim: false, aval: null };
      mapa[id] = temps[i];

  // ---------- util ----------
  function h(tag, props) {

      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;

  async function enviar() {

      : h("button", { class: "btn link", onclick: function () { ui.confirmarReinicio = true; render(); } }, "Recomeçar com outros clientes");

    return [
      h("header", { class: "topbar" },
        h("div", { style: "display:grid;gap:8px" },
          logo("small"),
          h("span", { class: "eyebrow" }, "Treinamento comercial Infornet · Nível " + (MODOS[s.modo] || MODOS.variado).rotulo),
          h("h1", null, estado.nome ? "Treino de " + estado.nome : "Seu treino")),
        h("div", { class: "progress" },
          h("div", { class: "stat" }, h("span", null, "Concluídos"), h("strong", null, feitos + " de 4")),
          h("div", { class: "stat" }, h("span", null, "Média"), h("strong", m != null ? { style: "color:" + corNota(m) } : null, m != null ? fmt(m) : "–")))),
      avisoClaude(),
      resumo,
      h("section", { class: "grid", "aria-label": "Clientes do treino" }, cards),
      feitos < 4 ? reinicio : null
    ];
  }

  function cola(p) {
    return h("details", { class: "cola", open: window.matchMedia("(min-width: 861px)").matches },
      h("summary", null, "Consulta rápida"),
      h("p", { class: "objective" }, h("strong", null, "Seu objetivo: "), PERFIS[p.perfil].objetivo),
      h("section", null, h("h3", null, "Escada de desconto"),
        h("div", { class: "ladder" }, [10, 15, 20, 30, 50].map(function (n) { return h("span", { style: "--s:" + (n * 0.6) }, n + "%"); })),
        h("p", { class: "muted" }, "Comece pelo menor. 50% é o teto. Mensalidade grátis não.")),
      h("section", null, h("h3", null, "Se o desconto não resolver"), h("p", null, "Troca do Wi-Fi 6 por Wi-Fi 7 bonificado.")),
      h("section", null, h("h3", null, "Diferenciais"),
        h("ul", null, h("li", null, "Atendimento local, rápido e pessoal"), h("li", null, "Chamado resolvido em cerca de 2 horas"),
          h("li", null, "Mesmo sinal em todos os bairros"), h("li", null, "Rede com capacidade sobrando"))),
      h("section", null, h("h3", null, "Lembretes"),
        h("ul", null, h("li", null, "Pergunte antes de oferecer (SPIN)"), h("li", null, "Descubra quem decide e paga (BANT)"),
          h("li", null, "Teste a distância antes de mandar técnico"), h("li", null, "Quem sai pelo preço costuma voltar em até 2 meses"),
          h("li", null, "Contrato de 12 meses com multa"))));
  }

  function telaChat() {
    var id = ui.atual, r = estado.sessao.res[id], p = persona(id);
    var temResposta = r.msgs.some(function (m) { return m.de === "atendente"; });

    var msgs = h("div", { class: "msgs", id: "msgs", "aria-live": "polite" },
      h("span", { class: "day" }, "Hoje"),
      r.msgs.map(function (m) { return h("div", { class: "bubble " + (m.de === "atendente" ? "me" : "them") }, m.t); }),
      ui.aguardando ? h("div", { class: "typing", "aria-label": p.nome + " está digitando" }, h("i"), h("i"), h("i")) : null,
      r.fim ? h("div", { class: "ended" }, h("strong", null, p.nome + " encerrou a conversa."),
        h("button", { class: "btn", onclick: function () { avaliar(id); } }, "Ver avaliação")) : null);

    var ta = h("textarea", { id: "msg", rows: 1, placeholder: r.fim ? "Conversa encerrada" : "Escreva sua mensagem…", disabled: r.fim || ui.aguardando,
      "aria-label": "Mensagem para " + p.nome,
      oninput: function (e) { ui.rascunho = e.target.value; ajustar(e.target); },
      onkeydown: function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviar(); } } });
    ta.value = ui.rascunho;

    var encerrar = ui.confirmarEncerrar
      ? h("div", { class: "confirm-bar confirm" }, h("span", null, "Encerrar este atendimento? Depois não dá para continuar a conversa."),
          h("button", { class: "btn", onclick: function () { avaliar(id); } }, "Encerrar e avaliar"),
          h("button", { class: "btn ghost", onclick: function () { ui.confirmarEncerrar = false; render(); } }, "Continuar conversando"))
      : null;

    return [
      avisoClaude(),
      h("div", { class: "chat-layout" },
        h("section", { class: "chat", "aria-label": "Conversa com " + p.nome },
          h("div", { class: "chat-head" },
            h("button", { class: "btn ghost", onclick: voltarPainel, "aria-label": "Voltar para os clientes" }, "← Clientes"),
            h("div", { class: "avatar p-" + p.perfil, style: "background:var(--c)" }, iniciais(p.nome)),
            h("div", { class: "chat-id" }, h("strong", null, p.nome), h("span", null, p.cidade + " · " + PERFIS[p.perfil].rotulo)),
            h("div", { class: "head-actions" },
              r.fim ? null : h("button", { class: "btn ghost", disabled: !temResposta || ui.aguardando,
                onclick: function () { ui.confirmarEncerrar = true; render(); } }, "Encerrar atendimento"))),
          encerrar,
          msgs,
          ui.erro ? h("p", { class: "err", role: "alert" }, ui.erro) : null,
          h("div", { class: "composer" }, ta,
            h("button", { class: "btn", disabled: r.fim || ui.aguardando, onclick: enviar }, "Enviar"))),
        cola(p))
    ];
  }

  function ajustar(ta) { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; }

  function telaAval() {
    var id = ui.atual, r = estado.sessao.res[id], p = persona(id);
    var topo = h("div", { class: "row" },
      h("button", { class: "btn ghost", onclick: voltarPainel }, "← Clientes"),
      chip(p.perfil), h("strong", null, p.nome + " · " + p.cidade),
      r.aval || ui.avaliando ? chipTemp(temperamento(id)) : null);

    if (ui.avaliando) {
      return [topo, h("div", { class: "loading", role: "status" },
        h("h2", null, "Avaliando o atendimento…"),
        h("p", { class: "muted" }, "O instrutor virtual está lendo a conversa. Isso leva de alguns segundos a um minuto."))];
    }
    if (!r.aval) {
      return [topo, h("div", { class: "notice warn", role: "alert" },
        h("strong", null, "Não foi possível gerar a avaliação"),
        h("p", null, ui.erroAval || "Tente de novo."),
        h("div", { class: "row" }, h("button", { class: "btn", onclick: function () { avaliar(id); } }, "Tentar de novo")))];
    }
    var a = r.aval;
    return [
      topo,
      h("section", { class: "eval" },
        h("div", { class: "eval-top" },
          h("div", { class: "big-score", style: "color:" + corNota(a.nota) }, fmt(a.nota), h("small", null, " / 10")),
          h("div", { style: "display:grid;gap:6px;min-width:0;flex:1 1 220px" },
            h("span", { class: "eyebrow" }, "Resultado"),
            h("h2", null, a.resultado),
            h("p", { class: "muted" }, "Objetivo: " + PERFIS[p.perfil].objetivo))),
        h("div", { class: "eval-grid" },
          h("div", { class: "panel" }, h("h3", null, "Critérios"),
            a.criterios.map(function (c) {
              return h("div", { class: "crit" },
                h("div", { class: "crit-top" }, h("span", null, c.nome), h("span", null, c.nota + "/10")),
                h("div", { class: "bar" }, h("i", { style: "width:" + (c.nota * 10) + "%;--c:" + corNota(c.nota) })),
                c.comentario ? h("p", null, c.comentario) : null);
            })),
          h("div", { style: "display:grid;gap:16px;align-content:start;min-width:0" },
            h("div", { class: "panel" }, h("h3", null, "Mandou bem"), h("ul", { class: "list" }, a.pontosFortes.map(function (t) { return h("li", null, t); }))),
            h("div", { class: "panel" }, h("h3", null, "Para melhorar"), h("ul", { class: "list" }, a.melhorar.map(function (t) { return h("li", null, t); }))),
            a.fraseExemplo ? h("div", { class: "panel" }, h("h3", null, "Você poderia ter dito"), h("p", { class: "example" }, a.fraseExemplo)) : null)),
        h("details", { class: "panel" }, h("summary", null, h("strong", null, "Ver a conversa")),
          h("div", { class: "transcript" }, r.msgs.map(function (m) {
            return h("p", null, h("b", null, m.de === "atendente" ? "Você: " : p.nome + ": "), m.t);
          }))),
        h("div", { class: "row" }, h("button", { class: "btn", onclick: voltarPainel }, "Voltar para os clientes")))
    ];
  }

  function render() {
    app.replaceChildren();
    var telas = { inicio: telaInicio, painel: telaPainel, chat: telaChat, aval: telaAval };
    if (ui.view !== "inicio" && !estado.sessao) ui.view = "inicio";
    anexar(app, telas[ui.view]());
    if (ui.view === "chat") {
      var box = document.getElementById("msgs"); if (box) box.scrollTop = box.scrollHeight;
      var ta = document.getElementById("msg"); if (ta) ajustar(ta);
    }
  }

  render();
})();
</script>
